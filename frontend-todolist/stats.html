<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Statistiques</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <section class="hero">
            <h1>Statistiques</h1>
            <p class="subtitle">Visualisez le nombre total, le statut complété et les tâches en cours.</p>
        </section>

        <section id="statsContainer" class="stats-panel">
            <div class="stat-card">
                <strong id="totalTasks">Nombre total de tâches : ...</strong>
            </div>
            <div class="stat-card">
                <strong id="completedTasks">Nombre de tâches terminées : ...</strong>
            </div>
            <div class="stat-card">
                <strong id="pendingTasks">Nombre de tâches à faire : ...</strong>
            </div>
        </section>

        <section class="chart-panel">
            <h2>Répartition des tâches</h2>
            <div class="chart-wrapper">
                <canvas id="tasksChart"></canvas>
            </div>
        </section>

        <div class="detail-actions">
            <a class="secondary-button" href="tasks.html">Retour à la liste des tâches</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="stats.js"></script>
</body>
</html>
