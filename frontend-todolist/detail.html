<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détail d'une tâche</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page-shell">
        <section class="detail-panel">
            <h1>Détail de la tâche</h1>

            <div id="taskDetails"></div>
            <p id="message"></p>

            <div class="button-group">
                <button id="completeBtn">Marquer comme terminée</button>
                <button id="reopenBtn">Réouvrir</button>
                <button id="deleteBtn">Supprimer</button>
            </div>

            <div class="detail-actions">
                <a class="secondary-button" href="tasks.html">Retour à la liste des tâches</a>
            </div>
        </section>
    </main>

    <script src="detail.js"></script>

</body>
</html>
